<body>
    <form action="#">
       
        <input type="text" name="name" id="fullname" placeholder="Full Name">
        <br><br>

      
        <input type="email" name="email" id="email" placeholder="you@college.edu">
        <br><br>

       
        <input type="tel" name="phone" id="phone" maxlength="10" minlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile">
        <br><br>

     
        <input type="text" name="char" id="char" minlength="6" placeholder="Min 6 character">
        <br><br>

       
        <input type="number" name="age" id="age" min="17" placeholder="Age"> 
        <br><br>

        <button type="submit">Register</button>
    </form>
    
</body>
