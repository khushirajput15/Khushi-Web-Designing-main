<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 15</title>
</head>
<body>
    <form>
        <fieldset>
            <label>Personal Details</label>

            <label for="name">Name: </label>
            <input type="text" name="fullname"  id="name">
            <br><br>

            <label for="email">E=mail: </label>
            <input type="email" name="email" id="email">
            <br><br>

            <label for="pass">Password: </label>
            <input type="password" name="password" id="pass" minlength="8">
            <br><br>

            <label>Gender: </label>

            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label> 

            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <br><br>

            <label>Hobbies: </label>

            <input type="checkbox" name="hobby" id="read" value="read">
            <label for="read">Reading</label>

            <input type="checkbox" name="hobby" id="code" value="code">
            <label for="code">Coding</label>
            <br><br>

            <label for="dob">DOB: </label>
            <input type="date" name="dob" id="dob">

        </fieldset>
    </form>
    
</body>
</html>
